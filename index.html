<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pré-Cadastro - Visual Modas</title>
  <style>
    :root {
      --primary-orange: #FF4500;
      --secondary-orange: #FF6B35;
      --bg-color: #F0F2F5;
      --card-bg: #FFFFFF;
      --text-color: #2D3748;
      --instagram-color: #E1306C;
      --whatsapp-group-color: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .logo-container {
      text-align: center;
      margin-bottom: -3px;
      position: relative;
      z-index: 10;
    }

    .logo-container img {
      max-width: 180px;
      height: auto;
      display: inline-block;
    }

    .form-card {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border-top: 8px solid var(--primary-orange);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4A5568;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
      background-color: #FFFFFF;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.1);
    }

    input[readonly] {
      background-color: #F7FAFC;
      color: #718096;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }

    .error-msg {
      color: #E53E3E;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-orange);
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-submit:hover {
      background-color: var(--secondary-orange);
    }

    /* Divisor social */
    .social-divider {
      margin: 25px 0 15px 0;
      text-align: center;
      position: relative;
    }

    .social-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #E2E8F0;
      z-index: 1;
    }

    .social-divider span {
      background-color: var(--card-bg);
      padding: 0 10px;
      position: relative;
      z-index: 2;
      font-size: 13px;
      color: #718096;
      font-weight: 600;
    }

    /* Botões Sociais */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn-social:hover {
      opacity: 0.9;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .btn-group {
      background-color: var(--whatsapp-group-color);
    }

    @media (max-width: 480px) {
      .row {
        flex-direction: column;
        gap: 0;
      }
      .logo-container img {
        max-width: 140px;
      }
      .form-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Visual Modas - Logo">
    </div>

    <div class="form-card">
      <form id="crediarioForm">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Digite seu nome completo">
        </div>

        <div class="row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" maxlength="14" required placeholder="000.000.000-00">
            <span class="error-msg" id="cpfError">CPF inválido</span>
          </div>
          <div class="form-group">
            <label for="nascimento">Data de Nasc.</label>
            <input type="date" id="nascimento" required>
          </div>
        </div>

        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" maxlength="9" required placeholder="00000-000">
          <span class="error-msg" id="cepError">CEP não encontrado</span>
        </div>

        <div class="form-group">
          <label for="logradouro">Rua / Logradouro</label>
          <input type="text" id="logradouro" readonly placeholder="Preenchimento automático">
        </div>

        <div class="row">
          <div class="form-group">
            <label for="numero">Número</label>
            <input type="text" id="numero" required placeholder="Nº">
          </div>
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" readonly placeholder="Automático">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" readonly placeholder="Automático">
          </div>
          <div class="form-group" style="max-width: 80px;">
            <label for="uf">UF</label>
            <input type="text" id="uf" readonly placeholder="-">
          </div>
        </div>

        <button type="submit" class="btn-submit">Enviar Cadastro pelo WhatsApp</button>
      </form>

      <!-- Seção de Atalhos e Links -->
      <div class="social-divider">
        <span>SIGA E ACOMPANHE A VISUAL MODAS</span>
      </div>

      <div class="social-links">
        <!-- Cole o link do perfil do Instagram no href -->
        <a href="https://www.instagram.com/visualmodascamacari?igsi=Nm9hbXp4eGw3cnFo" target="_blank" class="btn-social btn-instagram">
          Siga nosso Instagram
        </a>

        <!-- Cole o link do grupo de promoções do WhatsApp no href -->
        <a href="https://chat.whatsapp.com/HGX6XL6aZyY2FeVzOiAZmh?s=cl&p=a&mlu=0&ilr=0" target="_blank" class="btn-social btn-group">
          Grupo de Promoções e Compras
        </a>
      </div>
    </div>
  </div>

  <script>
    // Configurar o WhatsApp da loja para onde vão os dados do pré-cadastro
    const whatsappLoja = "5500000000000"; 

    document.getElementById('cpf').addEventListener('input', function (e) {
      let v = e.target.value.replace(/\D/g, '');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('cep').addEventListener('input', function (e) {
      let v = e.target.value.replace(/\D/g, '');
      v = v.replace(/^(\d{5})(\d)/, '$1-$2');
      e.target.value = v;
    });

    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      return resto === parseInt(cpf.substring(10, 11));
    }

    document.getElementById('cep').addEventListener('blur', function () {
      const cep = this.value.replace(/\D/g, '');
      const errorSpan = document.getElementById('cepError');

      if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(res => res.json())
          .then(data => {
            if (data.erro) {
              errorSpan.style.display = 'block';
              limparEndereco();
            } else {
              errorSpan.style.display = 'none';
              document.getElementById('logradouro').value = data.logradouro;
              document.getElementById('bairro').value = data.bairro;
              document.getElementById('cidade').value = data.localidade;
              document.getElementById('uf').value = data.uf;
              document.getElementById('numero').focus();
            }
          })
          .catch(() => {
            errorSpan.innerText = "Erro ao conectar com ViaCEP";
            errorSpan.style.display = 'block';
          });
      }
    });

    function limparEndereco() {
      document.getElementById('logradouro').value = '';
      document.getElementById('bairro').value = '';
      document.getElementById('cidade').value = '';
      document.getElementById('uf').value = '';
    }

    document.getElementById('crediarioForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const cpfVal = document.getElementById('cpf').value;
      const cpfError = document.getElementById('cpfError');

      if (!validarCPF(cpfVal)) {
        cpfError.style.display = 'block';
        document.getElementById('cpf').focus();
        return;
      }
      cpfError.style.display = 'none';

      const nome = document.getElementById('nome').value;
      const nascimento = document.getElementById('nascimento').value.split('-').reverse().join('/');
      const cep = document.getElementById('cep').value;
      const rua = document.getElementById('logradouro').value;
      const num = document.getElementById('numero').value;
      const bairro = document.getElementById('bairro').value;
      const cidade = document.getElementById('cidade').value;
      const uf = document.getElementById('uf').value;

      const texto = `🛍️ *NOVO PRÉ-CADASTRO DE CREDIÁRIO*\n` +
                    `🏢 *Loja:* Visual Modas\n\n` +
                    `👤 *DADOS DO CLIENTE*\n` +
                    `-----------------------------\n` +
                    `*Nome:* ${nome}\n` +
                    `*CPF:* ${cpfVal}\n` +
                    `*Data Nasc.:* ${nascimento}\n\n` +
                    `📍 *ENDEREÇO*\n` +
                    `-----------------------------\n` +
                    `*Rua:* ${rua}, Nº ${num}\n` +
                    `*Bairro:* ${bairro}\n` +
                    `*Cidade:* ${cidade}/${uf}\n` +
                    `*CEP:* ${cep}`;

      const link = `https://api.whatsapp.com/send?phone=${whatsappLoja}&text=${encodeURIComponent(texto)}`;
      window.open(link, '_blank');
    });
  </script>
</body>
</html>
